<!doctype html>
<html lang="en">
<head>
    <!-- ZyraX Home Strip -->
    <!-- Written and generated by Luke de Munk -->
    <!-- Munk IT -->
    <!-- Version: 0.10.0 -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>RGBW LED strip | ZyraX Home</title>
    <link rel="stylesheet" href="/strip.css">
    <link rel="icon" href="/favicon.ico">
    <script src="/language_pack_en.js" defer></script>
    <script src="/strip.js" defer></script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
    <main>
        <header>
            <span>ZyraX Home</span><h1 id="strip-title"></h1>
        </header>

        <section aria-labelledby="power-title">
            <h2 id="power-title"></h2>
            <div id="power-controls">
                <button type="button" value="1" id="power-on"></button>
                <button type="button" value="0" id="power-off"></button>
            </div>
            <p id="power-status" role="status"></p>
        </section>

        <details>
            <summary id="configure-network"></summary>
            <form id="network-form">
                <label><span id="ssid-label"></span><input name="ssid" maxlength="32" required></label>
                <label><span id="password-label"></span><input name="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required></label>
                <label><span id="hostname-label"></span><input name="hostname" maxlength="50" pattern="[A-Za-z0-9]([A-Za-z0-9\-]*[A-Za-z0-9])?" placeholder="ledstrip1" required></label>
                <button type="submit" id="save-network"></button>
                <p id="network-status" role="status"></p>
            </form>
        </details>
    </main>
</body>
</html>
